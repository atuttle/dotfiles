# status line on top
set-option -g status-position top

# MOAR COLORS!
set-option -sa terminal-overrides ",xterm:Tc"

# Enable mouse support
set -g mouse on

# Scrollback buffer size
set -g history-limit 40000

# appearance
# vibrant green: #39ff14
# vibrant purple: #AF87FF
# dark gray: #1a1a1a
set -g status-style "bg=#1a1a1a,fg=#AF87FF"
set -g window-status-style "bg=#1a1a1a,fg=#AF87FF"
set -g window-status-current-style "bg=#AF87FF,fg=#1a1a1a"

# change from default prefix to ctrl+space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# reload tmux config w/ ctrl+space,r - then show config reloaded msg
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"


##########################
# Window management
##########################

# Start window numbering at 1 instead of 0
set -g base-index 1

# Window navigation with Alt+number (no prefix needed)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 last-window

# when creating new windows, always position after current + before next
bind c new-window -a -c "#{pane_current_path}"
# same but use alt+shift+n
bind -n M-N new-window -a -c "#{pane_current_path}"

#kill window shortcut alt+w or alt+q
bind -n M-w kill-window
bind -n M-q kill-window

# Cycle through windows with Alt+Shift+Left/Right
bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# Move current window left/right with Ctrl+Alt+Shift+Left/Right
bind-key -n C-M-S-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-M-S-Right swap-window -t +1 \; select-window -t +1

#renumber windows when I kill one
set-option -g renumber-windows on

##########################
# Claude Code stuff
##########################

# Vi copy mode (arrow keys still work, Space to select, Enter to copy)
set -g mode-keys vi

# Copy mode: Enter copies to both tmux buffer and macOS clipboard
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# make shift+enter work inside tmux
bind -n S-Enter send-keys Escape "[13;2u"

# Bell monitoring for Claude Code idle notifications
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style "bg=#39ff14,fg=#1a1a1a,blink"
set-hook -g alert-bell 'run-shell "afplay /System/Library/Sounds/Ping.aiff &"'

##########################
# Tmux plugins
##########################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto-save/restore all of my tmux sessions, even after a reboot
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Show when prefix is pressed
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# status line
set -g @prefix_highlight_fg 'colour231'
set -g @prefix_highlight_bg 'colour39'
set -g @prefix_highlight_show_copy_mode 'on'
set -g status-right "#{prefix_highlight} | #(~/.config/tmux/uptime.sh)"
set -g status-interval 60

# command palette
# set -g @plugin 'lost-melody/tmux-command-palette'
run-shell '/Users/atcodes/DEV/tmp2/tmux-command-palette/init.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
